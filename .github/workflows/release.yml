name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  native:
    name: Native / ${{ matrix.platform }} x64
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-2025
            platform: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Validate version and tag
        run: python tools/release.py validate
      - name: Build Linux baseline container
        if: runner.os == 'Linux'
        run: docker build --tag lockbox-build --file desktop/linux/Dockerfile .
      - name: Build and exercise Linux bundles
        if: runner.os == 'Linux'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/work" \
            --env HOME=/tmp/lockbox-build-home \
            --env npm_config_cache=/tmp/lockbox-npm-cache \
            --env PYINSTALLER_CONFIG_DIR=/tmp/lockbox-pyinstaller \
            --entrypoint sh lockbox-build tools/ci-linux.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Windows'
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: |
          python -m pip install --disable-pip-version-check -r desktop/requirements-build.txt
          npm ci --no-audit --no-fund
      - name: Test Windows state, locking and field guards
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Build Windows desktop
        if: runner.os == 'Windows'
        run: python desktop/build.py
      - name: Build Windows server tool
        if: runner.os == 'Windows'
        run: python tools/build-server.py
      - name: Exercise frozen Windows bundles
        if: runner.os == 'Windows'
        run: |
          python tools/smoke-server.py server/dist/lockbox-server
          python tools/smoke-desktop.py desktop/dist/Lockbox/Lockbox.exe
      - name: Stage native assets in a flat release directory
        run: python tools/release.py native
      - name: Upload native release candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}-x64
          path: dist/native/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  extensions:
    name: Browser extensions / reproducible sources
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Validate version and tag
        run: python tools/release.py validate
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test cryptography, origin boundaries and passkeys
        run: npm test
      - name: Build extensions
        run: npm run build
      - name: Package allowlisted files and reviewer sources
        run: python tools/package-extension.py
      - name: Rebuild clean reviewer sources and compare bytes
        run: python tools/verify-extension-rebuild.py
      - name: Validate Firefox package
        run: npm exec --yes --package=addons-linter@10.14.0 -- addons-linter extension/dist/firefox --warnings-as-errors
      - name: Sign Firefox for unlisted distribution when configured
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          if [[ -z "$WEB_EXT_API_KEY" && -z "$WEB_EXT_API_SECRET" ]]; then
            echo "Mozilla credentials absent; publishing an explicitly unsigned development XPI."
          elif [[ -z "$WEB_EXT_API_KEY" || -z "$WEB_EXT_API_SECRET" ]]; then
            echo "Both Mozilla repository secrets must be configured." >&2
            exit 1
          else
            version=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
            npm exec --yes --package=web-ext@10.8.0 -- web-ext sign \
              --no-config-discovery --no-input --channel unlisted \
              --amo-base-url https://addons.mozilla.org/api/v5/ \
              --source-dir extension/dist/firefox \
              --artifacts-dir extension/dist/signed \
              --upload-source-code "extension/dist/lockbox-extension-source-$version.zip" \
              --amo-metadata extension/release/amo-metadata.json
            test -n "$(find extension/dist/signed -maxdepth 1 -name '*.xpi' -print -quit)"
          fi
      - name: Prepare explicitly named extension assets
        run: python tools/release.py extensions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extensions
          path: dist/extensions/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, extensions]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*'
          path: dist/downloaded
          merge-multiple: true
      - name: Verify complete asset set and checksums
        run: python tools/release.py collect
      - name: Publish immutable version assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Lockbox ${RELEASE_TAG#v}" --notes-file dist/release-notes.md
