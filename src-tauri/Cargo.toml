[package]
name = "credlet"
version = "0.3.0"
description = "Credlet unified Svelte client"
edition = "2021"
license = "MIT"

[lib]
name = "credlet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
